PART
{
	name = SEP_plug
	module = Part
	author = AlbertKermin and CobaltWolf
	MODEL
	{
		model = SurfaceExperimentPackage/Parts/SEP_plug
	}
	rescaleFactor = 1.0
	node_stack_bottom = 0.0, 0.0319243, 0.0, 0.0, -1.0, 0.0, 0
	node_attach = 0.0, 0.0319243, 0.0, 0.0, -1.0, 0.0, 0
	
	TechRequired = basicScience
	entryCost = 1800
	cost = 100
	category = Electrical
	subcategory = 0
	title = #LOC_SurfaceExperimentPack_plug_title //= AKI Power Transfer Conduit
	manufacturer = #LOC_SurfaceExperimentPack_mfg //= Albert Kermin Industries
	description = #LOC_SurfaceExperimentPack_plug_desc //= This plug is one end of an AKI Power Transfer Conduit. Use it to connect your various Surface Experiment Package components back to the Central Station. Attach one to each end of where you need the conduit, then link them using the right click menu.
	attachRules = 1,0,1,0,1
	mass = 0.002
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 1
	crashTolerance = 30
	breakingForce = 2000
	breakingTorque = 2000
	maxTemp = 2000
	bulkheadProfiles = srf
	
	tags = #LOC_SurfaceExperimentPack_plug_tags //= cck-eva-items sep kis kas surface experiment inventory attachment eva plug port power energy (elect cord connector
	
	// KAS 1.x (>= 1.0): the legacy KASModulePort/KASModuleStrut modules were removed in KAS 1.0.
	// Follows KAS's own Patches/MM-LegacyKASPipesPart.txt template.
	// Active end: shows Link/Unlink in the part action window. AlwaysCoupled merges the linked
	// experiment into the station's vessel, which is what ModuleSEPStation needs to see it.
	MODULE
	{
		name = KASLinkSourceInteractive

		// AbstractLinkPeer
		linkType = SEPPlug
		linkTypeDisplayName = #LOC_SurfaceExperimentPack_plug_title
		attachNodeName = kasSrcAuto0
		// position of the "plugNode" transform in the model (top of the plug, pointing up)
		attachNodeDef = 0.0, 0.107, 0.0,  0.0, 1.0, 0.0,  0
		allowCoupling = true

		// KASLinkSourceBase
		coupleMode = AlwaysCoupled
		jointName = plugJoint
		linkRendererName = plugCable
		sndPathDock = KAS/Sounds/plugdocked
		sndPathUndock = KAS/Sounds/unplugdocked

		// KASLinkSourceInteractive
		sndPathPlug = KAS/Sounds/plug
		sndPathUnplug = KAS/Sounds/unplug
		sndPathBroke = KAS/Sounds/broke
		startLinkMenu = Link
		breakLinkMenu = Unlink
	}

	// Passive end: lets another plug link to this one.
	MODULE
	{
		name = KASLinkTargetBase

		linkType = SEPPlug
		linkTypeDisplayName = #LOC_SurfaceExperimentPack_plug_title
		attachNodeName = kasTgtAuto0
		attachNodeDef = 0.0, 0.107, 0.0,  0.0, 1.0, 0.0,  0
		allowCoupling = true
	}

	MODULE
	{
		name = ModuleKISItem
		volumeOverride = 5
		stackable = true
		allowStaticAttach = 1
		staticAttachBreakForce = 2000
	}

	// Cable visual, reusing SEP's own pipe texture.
	MODULE
	{
		name = KASRendererPipe

		rendererName = plugCable
		pipeTextureRescaleMode = TileFromSource
		pipeDiameter = 0.02
		pipeTexturePath = SurfaceExperimentPackage/Parts/pipe
		pipeNormalsTexturePath =
		pipeTextureSamplesPerMeter = 4

		sourceJoint
		{
			sphereOffset = 0.01
			sphereDiameter = 0.03
			armDiameter = 0.02
		}
		targetJoint
		{
			sphereOffset = 0.01
			sphereDiameter = 0.03
			armDiameter = 0.02
		}
	}

	// Same limits as the original KASModuleStrut (30 m, 100 deg, break force 600).
	MODULE
	{
		name = KASJointRigid

		jointName = plugJoint
		minLinkLength = 0
		maxLinkLength = 30
		linkBreakForce = 600
		sourceLinkAngleLimit = 100
		targetLinkAngleLimit = 100
		anchorAtSource = 0, 0, 0
		anchorAtTarget = 0, 0, 0
	}
}
